# Builds the signed Folio Android APK.
#
# - A push to main builds the APK and
#   keeps it as a workflow artifact, for testing on a phone.
# - A tag like folio-v0.1.0 also publishes it as a GitHub Release.
#
# Signing uses the repo secrets FOLIO_KEYSTORE_BASE64, FOLIO_KEYSTORE_PASSWORD
# and FOLIO_KEY_ALIAS. The keystore never enters the repo. No SUPABASE_*
# dart-defines are passed, so the build is offline only.
name: Folio Android

on:
  push:
    branches: [main]
    tags: ['folio-v*']
  workflow_dispatch:

permissions:
  contents: write # needed only to create the release on a tag

concurrency:
  group: folio-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # Uses the committed pubspec.lock; fails instead of resolving new versions.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Write signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLIO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOLIO_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. Refusing to ship a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/folio-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/folio-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - run: flutter build apk --release

      - name: Name the APK by version
        id: apk
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          out="Folio-$version.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "name=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/folio-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "Folio ${GITHUB_REF_NAME#folio-v}" \
            --notes "Android APK. Install it by opening the file on your phone and allowing installs from this source." \
            --prerelease
